name: Site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:egg
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run test:releases
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Firestore privacy rules in emulator
        run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-circuito 'npm run test:rules'
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-production
          path: build/
          retention-days: 14
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: web-production
          path: build/
      - run: npx cap sync android
      - run: bash gradlew :app:assembleRelease :app:bundleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
  ios:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: web-production
          path: build/
      - run: npx cap sync ios
      - name: Compile Release for iPhone and iPad simulator
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-release
          path: ios/DerivedData/Build/Products/Release-iphonesimulator/*.app
          retention-days: 14
  announce:
    if: github.event_name == 'push'
    needs: [verify, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Notify all users after successful production release
        run: node scripts/announce-update.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_RELEASE_EMAIL: ${{ secrets.FIREBASE_RELEASE_EMAIL }}
          FIREBASE_RELEASE_PASSWORD: ${{ secrets.FIREBASE_RELEASE_PASSWORD }}
